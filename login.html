<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — SwiftTrust Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-shell">

  <aside class="auth-side">
    <div class="auth-side-inner">
      <a href="index.html" class="brand">
        <div class="brand-mark"><i class="fas fa-shield-halved"></i></div>
        Swift<span>Trust</span>
      </a>
      <h2>Welcome back.</h2>
      <p>Sign in to manage your accounts, send money, and view your transactions.</p>
    </div>
    <ul class="auth-points">
      <li><i class="fas fa-check-circle"></i> Your accounts, all in one place</li>
      <li><i class="fas fa-check-circle"></i> Instant transfers between accounts</li>
      <li><i class="fas fa-check-circle"></i> Real-time transaction history</li>
    </ul>
  </aside>

  <main class="auth-main">
    <form class="auth-form" id="loginForm">
      <h1>Sign in</h1>
      <p class="sub">Welcome back to SwiftTrust.</p>

      <div class="form-alert" id="loginAlert"></div>

      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
        <i class="fas fa-lock-open"></i> Sign in
      </button>

      <div class="auth-foot">
        Don't have an account? <a href="signup.html">Open one</a>
      </div>
    </form>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const loginForm = document.getElementById('loginForm');
const alertEl = document.getElementById('loginAlert');
const submitBtn = document.getElementById('submitBtn');

function showAlert(msg, type) {
  alertEl.textContent = msg;
  alertEl.className = 'form-alert show ' + (type || 'error');
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertEl.className = 'form-alert';

  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Signing in…';

  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;

    // Look up SwiftTrust profile
    const snap = await db.collection('swifttrust_users').doc(uid).get();

    if (!snap.exists) {
      await auth.signOut();
      showAlert('No SwiftTrust account is linked to this email.');
      return;
    }

    const data = snap.data();
    const status = data.status || 'pending';

    if (status === 'blocked') {
      await auth.signOut();
      showAlert('This account has been suspended. Contact support.');
      return;
    }

    if (status === 'pending') {
      await auth.signOut();
      showAlert('Your account is under review. We\'ll notify you once it\'s approved.', 'info');
      return;
    }

    // Approved — go to dashboard
    window.location.href = 'dashboard.html';

  } catch (err) {
    console.error(err);
    let msg = 'Sign in failed. Please try again.';
    if (err.code === 'auth/invalid-credential' ||
        err.code === 'auth/wrong-password' ||
        err.code === 'auth/user-not-found') {
      msg = 'Incorrect email or password.';
    } else if (err.code === 'auth/too-many-requests') {
      msg = 'Too many attempts. Please try again in a moment.';
    } else if (err.code === 'auth/invalid-email') {
      msg = 'Please enter a valid email address.';
    }
    showAlert(msg);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fas fa-lock-open"></i> Sign in';
  }
});
</script>
</body>
</html>
